<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Faihma's NCLEX Flashcards</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="login-screen" id="loginScreen">
            <div class="login-card">
                <h1 class="login-title">💙</h1>
                <h2 class="login-subtitle">Welcome back, Faihma!</h2>
                <p style="color: var(--text-light); margin-bottom: 20px;">Enter your PIN to access your NCLEX flashcards</p>
                <input type="password" class="pin-input" id="pinInput" placeholder="Enter PIN" maxlength="4">
                <button class="login-btn" id="loginBtn">Unlock</button>
            </div>
        </div>

        <div class="app-content" id="appContent" style="display: none;">
            <header class="header">
                <div class="header-left">
                    <h1 class="app-title">NCLEX Cards</h1>
                    <div class="streak-counter">
                        <span class="fire-emoji">🔥</span>
                        <span id="streakCount">0</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" id="statsBtn" title="View Stats">📊</button>
                    <button class="icon-btn" id="darkModeBtn" title="Toggle Dark Mode">🌙</button>
                    <button class="icon-btn" id="logoutBtn" title="Logout">🚪</button>
                </div>
            </header>

            <main class="main-content">
                <div class="mode-toggle">
                    <button class="mode-btn active" id="courseModeBtn">📖 Course Material</button>
                    <button class="mode-btn" id="generalModeBtn">📝 General NCLEX</button>
                </div>

                <div class="command-bar" role="toolbar" aria-label="Study commands">
                    <button class="command-pill" id="subjectDrawerBtn">📚 Subject</button>
                    <button class="command-pill" id="shuffleBtn">🔀 Shuffle</button>
                    <button class="command-pill" id="reviewBtn">🔄 Review Missed<span class="review-badge hidden" id="reviewBadge"></span></button>
                    <button class="command-pill" id="quickPaletteBtn">⚡ Quick Actions</button>
                </div>

                <div class="subject-drawer" id="subjectDrawer" aria-hidden="true">
                    <label for="subjectSelect" class="drawer-label">Choose subject</label>
                    <div class="select-wrapper">
                        <select class="subject-select" id="subjectSelect"></select>
                    </div>
                </div>

                <div class="coach-prompt" id="coachPrompt">Coach is analyzing your progress…</div>

                <div class="daily-goal" id="dailyGoal">
                    <div class="goal-ring">
                        <svg viewBox="0 0 52 52">
                            <circle class="goal-ring-bg" cx="26" cy="26" r="22"/>
                            <circle class="goal-ring-fill" id="goalRingFill" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
                        </svg>
                        <span class="goal-ring-text" id="goalRingText">0/20</span>
                    </div>
                    <div class="goal-info">
                        <div class="goal-title" id="goalTitle">Daily Goal</div>
                        <div class="goal-subtitle" id="goalSubtitle">Answer 20 cards today</div>
                    </div>
                </div>

                <div class="progress-container">
                    <div class="progress-header">
                        <span class="progress-text" id="progressText">Question 1 of 200</span>
                        <span class="progress-text" id="accuracyText">Accuracy: 0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="flashcard-container">
                    <div class="flashcard" id="flashcard">
                        <div class="card-face card-front">
                            <div class="mastery-indicator" id="masteryIndicator"></div>
                            <div class="card-question" id="cardQuestion">Loading...</div>
                            <ul class="card-choices" id="cardChoices"></ul>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-explanation" id="cardExplanation"></div>
                            <div class="card-hint" id="cardHint" style="display: none;"></div>
                        </div>
                    </div>
                </div>

                <div class="answer-buttons" id="answerButtons">
                    <button class="answer-btn btn-incorrect" id="againBtn">🔄 Again</button>
                    <button class="answer-btn btn-unsure" id="hardBtn">😤 Hard</button>
                    <button class="answer-btn btn-correct" id="goodBtn">👍 Good</button>
                    <button class="answer-btn btn-correct" id="easyBtn" style="background: linear-gradient(135deg, #26a69a, #00897b);">⚡ Easy</button>
                </div>

                <div class="answer-buttons" id="nextButton" style="display: none;">
                    <button class="answer-btn btn-next" id="nextBtn">Next Card →</button>
                </div>

                <div class="stats-dashboard" id="statsDashboard" aria-live="polite">
                    <div class="stat-section" id="todaySection">
                        <div class="section-header"><h3>Today</h3><button class="ghost-btn" data-detail="today">Details</button></div>
                        <div class="section-body" id="todaySummary"></div>
                        <div class="section-detail" id="todayDetail"></div>
                    </div>
                    <div class="stat-section" id="dueSection">
                        <div class="section-header"><h3>Due now</h3><button class="ghost-btn" data-detail="due">Details</button></div>
                        <div class="section-body" id="dueSummary"></div>
                        <div class="section-detail" id="dueDetail"></div>
                    </div>
                    <div class="stat-section" id="weakSection">
                        <div class="section-header"><h3>Weak areas</h3><button class="ghost-btn" data-detail="weak">Details</button></div>
                        <div class="section-body" id="weakSummary"></div>
                        <div class="section-detail" id="weakDetail"></div>
                    </div>
                    <div class="stat-section" id="trendSection">
                        <div class="section-header"><h3>Weekly trend</h3><button class="ghost-btn" data-detail="trend">Details</button></div>
                        <div class="section-body" id="trendSummary"></div>
                        <div class="section-detail" id="trendDetail"></div>
                    </div>
                    <div class="stats-actions">
                        <button onclick="exportProgress()">📤 Export Progress</button>
                        <button onclick="importProgress()">📥 Import Progress</button>
                    </div>
                </div>
            </main>
        </div>

        <div class="quick-palette" id="quickPalette" aria-hidden="true">
            <div class="palette-card">
                <input id="paletteSearch" type="text" placeholder="Search subject / type filter / jump #" aria-label="Quick action search" />
                <div class="palette-actions" id="paletteActions"></div>
            </div>
        </div>

        <div class="swipe-indicators swipe-left">❌</div>
        <div class="swipe-indicators swipe-right">✅</div>
        <div class="toast" id="toast"></div>
        <div class="particles" id="particles"></div>
    </div>

    <script src="config.js"></script>
    <script src="flashcards.js"></script>
    <script src="app.js"></script>
</body>
</html>
